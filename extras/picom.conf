# picom config for PRO-dark-XFCE-4.20 (X11 session): 10px rounded corners,
# soft shadows and fades. Install: cp extras/picom.conf ~/.config/picom/picom.conf
backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Plank'"
];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
